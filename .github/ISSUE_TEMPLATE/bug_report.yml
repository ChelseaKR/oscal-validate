name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The most useful reports say what you ran,
        what happened, and what you expected instead.

        **Do not attach a real system security plan, assessment result, or
        POA&M.** Reduce it to the smallest synthetic document that reproduces
        the behavior. If this is a security issue, see SECURITY.md for how to
        report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran and what came back. Paste the output rather than describing it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >-
        If a NIST schema declaration, constraint, or documentation page says
        otherwise, quoting it helps a lot.
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: A synthetic document that reproduces it
      render: json
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: oscal-validate --version, or the commit you are on
    validations:
      required: true
