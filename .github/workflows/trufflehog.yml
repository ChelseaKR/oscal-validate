# Full-history secret scan, over every result tier TruffleHog reports.
# gitleaks runs diff-scoped in pre-commit (see .pre-commit-config.yaml); this
# is a periodic sweep of the entire commit history with a different engine and
# its own detector set, catching anything a diff-scoped scan by construction
# cannot (a secret introduced and later removed in the same PR still shows up
# in history). Also runs on push and pull_request so every change is swept,
# not just the weekly schedule -- but only because `base:`/`head:` are set
# below. Left unset, the action scans the triggering event's diff on those two
# events and the whole history only on schedule/workflow_dispatch.
name: trufflehog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 0" # weekly, Sunday, staggered off ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trufflehog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: full-history secret scan (all result tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Necessary precondition, and NOT the thing that makes this a history
          # scan. Depth decides how much history is on disk; `base:`/`head:` on
          # the step below decide how much of it the scanner is asked to read.
          # Full depth was checked out here the whole time the push and
          # pull_request runs were scanning a diff.
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog (full history, all result tiers)
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          # This pair is what makes the scan read history. The action picks its
          # range from the triggering event unless one of these is non-empty:
          # on `push` it runs `--since-commit <event.before> --branch
          # <event.after>`, on `pull_request` the PR's own base..head diff, and
          # only on `schedule`/`workflow_dispatch` does it pass an empty
          # `--since-commit`, i.e. everything. So until 2026-09-13 the weekly
          # cron and a manual dispatch did read the whole history, while the
          # two events that gate a merge -- every push to main and every
          # pull_request -- read the event's diff and reported it under the
          # name "full-history secret scan (all result tiers)".
          #
          # `head` must be non-empty: the action takes its explicit-range
          # branch on `[ -n "$BASE" ] || [ -n "$HEAD" ]`, so `base: ''` on its
          # own leaves both empty and falls straight back to the event logic.
          # `HEAD` rather than a branch name because a `pull_request` checkout
          # is a detached merge ref with no branch to name. The result is
          # `--since-commit '' --branch HEAD` on every event.
          #
          # Measured on a throwaway clone with a real-shaped AWS key planted in
          # one commit and deleted in the next: the event-derived diff range
          # exits 0, `--since-commit "" --branch HEAD` exits 183.
          base: ''
          head: HEAD
          # Pinned, and it must equal the version comment on the pinned ref
          # above. The action's `version:` input defaults to "latest" and it
          # runs `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so the SHA
          # pin above pins only the wrapper, not the binary that scans. Without
          # this input the sweep silently tracked whatever upstream published
          # last, and every Dependabot bump of the ref was a no-op because
          # Dependabot never edits a `with:` input.
          version: "3.97.4"
          # The action's baked-in command already passes --fail; repeating it
          # is a CLI error ("flag 'fail' cannot be repeated").
          #
          # Lob is excluded because its detector matches this repository's
          # pytest function names. Lob keys are `test_` or `live_` followed by
          # alphanumerics, which is also the shape of every test under tests/,
          # and Lob's verifier confirms them because a malformed key and an
          # unauthorized key are indistinguishable in its response. It is a
          # known false positive that has broken scans across this portfolio.
          # There is no Lob integration here and no direct-mail dependency in
          # pyproject.toml, so the detector can only ever produce noise in this
          # repository. Scoped to the one detector on purpose: excluding tests/
          # by path would blind the scan to real secrets in fixtures, which is
          # where they most often hide.
          # The tier list is load-bearing. `--only-verified` reports a finding
          # only when TruffleHog asked the provider and the provider said the
          # credential is live. A credential that leaked and was then REVOKED --
          # the normal end state of a real incident, and the exact case a
          # scheduled full-history sweep exists to catch -- answers "no", which
          # TruffleHog files under `unverified`. So the setting this job ran
          # with until 2026-09-06 could not fail on the thing it exists for.
          #
          # Measured 2026-09-06 on a throwaway clone with a real-shaped AWS key
          # planted in one commit and deleted in the next (confirmed present in
          # history and absent at HEAD first, or the test measures a diff scan):
          #
          #   --only-verified                        exit 0,   0 reported
          #   --results=verified                     exit 0,   0 reported
          #   --results=verified,unknown             exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # This repository's whole history was re-scanned under the widened
          # tier on 2026-09-06 with trufflehog 3.97.1 and reported nothing, so
          # widening costs no false positives here. If a placeholder fixture
          # ever does fire, exclude that DETECTOR by name -- as Lob is excluded
          # below -- and never narrow the tier back.
          extra_args: --results=verified,unknown,unverified --exclude-detectors=Lob
