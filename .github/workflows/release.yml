# SPDX-License-Identifier: Apache-2.0
name: release

# Trusted-main release. After pushing a signed annotated tag, the maintainer
# dispatches this workflow from `main` and supplies the tag as an input:
#
#   git tag -s vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z
#
# `workflow_dispatch` is deliberate, and it is the whole security posture in
# one line: a `push: tags:` trigger runs the workflow definition stored *at
# the tagged ref*, so whoever can push a tag also chooses the release
# workflow. Dispatching from `main` means the release authority is always the
# reviewed workflow on the trusted branch, and the tag is only data it checks.
#
# Nothing here runs on its own. This file is inert until the maintainer both
# registers the PyPI Trusted Publisher (see the `pypi-publish` job) and
# dispatches the workflow with a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

# Least-privilege default token. Elevated scopes are granted per job below.
permissions:
  contents: read

# One global concurrency group: two versions can never build or publish
# concurrently, and a re-run queues instead of racing a live publish.
concurrency:
  group: release
  cancel-in-progress: false

# Single source of truth for which tag this run builds and publishes.
# Referenced as "$RELEASE_TAG" inside `run:` bodies and never interpolated
# with ${{ }} into a shell: a tag name is attacker-influenced for anyone who
# can push a tag, and ${{ }} interpolation into `run:` is a template-injection
# vector. The authorize job proves this exact tag is annotated, signed, and
# reachable from main before anything downstream runs.
env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  # Step 0, trust. The standards-owned reusable workflow checks out this
  # repository's reviewed `main`, rejects non-stable and lightweight tags,
  # verifies the SSH signature against the committed `.github/allowed_signers`,
  # proves the tagged commit is reachable from current origin/main, and
  # returns immutable identifiers for everything below. Pinned to a full
  # 40-character commit SHA; a branch or moving-tag pin would be a mutable
  # trust anchor and is not conformant.
  authorize:
    uses: ChelseaKR/.github/.github/workflows/release-authorize.yml@7be4c3e44e2acf20e8a98eeea4351c1e5d2789bc
    permissions:
      contents: read
    with:
      tag: ${{ github.event.inputs.tag }}

  # Gate: nothing downstream builds, attests, or publishes unless this passes
  # at the exact commit the verified tag points to. Tag authenticity belongs
  # to `authorize`; the product gates belong here. A PR's prior green tick is
  # not evidence about the tagged commit.
  verify:
    name: verify at tagged commit
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out the authorized release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false
          # tests/test_release_metadata.py reads the repository's tags to
          # check what CITATION.cff and the README claim was released. A
          # one-commit checkout carries none, and an empty tag list read from
          # that is absence rendered as a value: it would make every release
          # claim unfalsifiable here.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      # No cross-run cache anywhere on the release path: a cache hit is an
      # unverified input into an artifact that is about to be signed and
      # published. ci.yml keeps its cache; a mutable-branch run carries
      # materially lower stakes.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Run the merge-blocking gate at the tagged commit
        run: make verify

      - name: The tag, the package version, and the CHANGELOG must agree
        # A release tagged v0.3.1 that ships 0.3.0 is worse than a failed
        # publish: PyPI would carry a version this repository never tagged,
        # and it cannot be taken back.
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          packaged="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$version" != "$packaged" ]; then
            echo "::error title=version mismatch::tag $RELEASE_TAG does not match pyproject version $packaged"
            exit 1
          fi
          grep -q "^## \[${version}\]" CHANGELOG.md || {
            echo "::error title=no changelog section::CHANGELOG.md has no section for ${RELEASE_TAG}"
            exit 1
          }

  build:
    name: build · provenance · SBOM
    needs: [authorize, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Sigstore signing for the provenance and SBOM attestations
      attestations: write
    steps:
      - name: Check out the authorized release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Build wheel and sdist
        run: uv build

      - name: Attest build provenance (SLSA, keyless via Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      - name: Generate a CycloneDX SBOM for what actually ships
        run: |
          set -euo pipefail
          # Install the freshly built wheel into an isolated environment and
          # describe that environment. The validator has no runtime
          # dependency, and the SBOM records that rather than asserting it in
          # prose. `--validate` is blocking: a schema violation fails the job.
          uv venv --python 3.12 .sbom-venv
          uv pip install --python .sbom-venv/bin/python dist/*.whl
          uvx --from cyclonedx-bom==7.3.0 cyclonedx-py environment .sbom-venv/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.7 \
            --output-reproducible \
            --output-format JSON \
            --validate \
            --output-file "dist/oscal-validate.cdx.json"
          # Reproducible CycloneDX output omits its random serial number,
          # while GitHub's SBOM predicate detector requires one. Derive a
          # stable UUIDv5 from the immutable release URL, so each tag gets a
          # unique repeatable serial without giving up reproducibility.
          serial_number=$(.sbom-venv/bin/python -c \
            'import os, uuid; value = "https://github.com/ChelseaKR/oscal-validate/releases/tag/" + os.environ["RELEASE_TAG"]; print("urn:uuid:" + str(uuid.uuid5(uuid.NAMESPACE_URL, value)))')
          jq --arg serial_number "$serial_number" \
            '.serialNumber = $serial_number' \
            dist/oscal-validate.cdx.json > dist/oscal-validate.cdx.tmp
          mv dist/oscal-validate.cdx.tmp dist/oscal-validate.cdx.json
          jq -e \
            '.bomFormat == "CycloneDX" and .specVersion == "1.7" and (.serialNumber | startswith("urn:uuid:"))' \
            dist/oscal-validate.cdx.json >/dev/null

      - name: Attest the SBOM (signed via Sigstore)
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"
          sbom-path: "dist/oscal-validate.cdx.json"

      - name: Download a portable attestation bundle for release consumers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-attestations
          (
            cd /tmp/release-attestations
            gh attestation download "$GITHUB_WORKSPACE"/dist/*.whl --repo "$GITHUB_REPOSITORY"
          )
          cat /tmp/release-attestations/sha256*.jsonl > dist/oscal-validate.intoto.jsonl

      # The matching CHANGELOG section becomes the release notes. Extracted
      # here because this job holds the checkout; the publication job below is
      # checkout-free by design.
      - name: Extract the CHANGELOG section as release notes
        run: |
          set -euo pipefail
          awk -v ver="${RELEASE_TAG#v}" '
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      # Release integrity: hand the exact bytes that were attested above to
      # the publishing jobs. Neither may rebuild, because a second build's
      # output is not what the attestation covers.
      - name: Record the attested artifact digests
        run: |
          set -euo pipefail
          (cd dist && sha256sum ./*.whl ./*.tar.gz | tee SHA256SUMS)

      - name: Upload the attested dist for the publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-attested
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Upload the complete release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  # Split authority: verification and build execute repository code with
  # `contents: read`; this dependent job receives `contents: write` and never
  # checks out or executes repository code. It re-reads the live tag object
  # and compares it with the authorizer's immutable identifier immediately
  # before publishing, so a tag moved after authorization stops the release.
  github-release:
    name: publish GitHub release (checkout-free)
    needs: [authorize, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the attested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Re-check the immutable tag object before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          test "$live" = "$TAG_OBJECT_SHA"

      # Idempotent: a re-run of a partly-failed release completes it instead
      # of erroring on an existing release, and re-uploads the same assets.
      - name: Publish the GitHub release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "oscal-validate $RELEASE_TAG" \
                 --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" dist/* --clobber

  pypi-publish:
    name: publish to PyPI (Trusted Publishing)
    needs: [authorize, build, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/oscal-validate
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI Trusted Publishing; no stored secret
    steps:
      # Publish the exact bytes the build job built and attested. No checkout,
      # no toolchain, no rebuild in this job: a rebuilt wheel is not the
      # artifact the attestation covers, and PyPI is not revocable.
      - name: Download the attested dist from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-attested
          path: dist

      - name: Re-check artifact digests against the attested manifest
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          rm SHA256SUMS # not a distribution file; the upload takes dist/ wholesale

      - name: Re-check the immutable tag object before PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          test "$live" = "$TAG_OBJECT_SHA"

      # Trusted Publishing over OIDC. There is no API token in this
      # repository's secrets and none is wanted: a long-lived token is a
      # credential that can leak, and this exchanges a short-lived OIDC
      # identity instead. It requires a one-time registration on PyPI, which
      # only the project owner can do:
      #
      #   PyPI -> Your projects -> Publishing (or "Add a pending publisher",
      #   because the project does not exist on PyPI yet)
      #     PyPI Project Name:  oscal-validate
      #     Owner:              ChelseaKR
      #     Repository name:    oscal-validate
      #     Workflow name:      release.yml
      #     Environment name:   pypi
      #
      # Until that registration exists, this job fails at the upload with a
      # trusted-publisher error and nothing is published. Everything above it
      # -- verification, build, attestation, the GitHub release -- still runs
      # and still succeeds, so the release is usable from GitHub before PyPI
      # is wired up.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-published:
    name: verify the published package and its attestations
    needs: [build, pypi-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download the attested dist from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-attested
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Verify the Sigstore-backed attestation on the built wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/*.whl --repo "$GITHUB_REPOSITORY"

      # `pypi-publish` exiting 0 says the upload did not error. This says the
      # version that is actually on the index installs and runs.
      - name: Install the published version from PyPI and run it
        run: |
          set -euo pipefail
          uvx --refresh --from "oscal-validate==${RELEASE_TAG#v}" oscal-validate --version
