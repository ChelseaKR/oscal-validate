name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tests/test_release_metadata.py reads the repository's tags to check
          # what CITATION.cff and the README claim was released. The default
          # checkout is one commit deep and carries no tags, and an empty tag
          # list read from that is absence rendered as a value: it would make
          # every release claim unfalsifiable here. Fetch them.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Run the local verification gate
        run: make verify

  # `make verify` covers the action's entry point (tests/test_action_runner.py).
  # This job covers the composite wrapper around it: the inputs in action.yml,
  # the interpreter it pins, and the exit code GitHub actually observes.
  action-self-test:
    name: action self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A clean document passes
        uses: ./
        with:
          path: tests/fixtures/clean_catalog.json

      # Start from the document just proven clean and remove exactly one
      # required property, the same way tests/test_break_the_gate.py does.
      - name: Break the clean catalog on purpose
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("tests/fixtures/clean_catalog.json").read_text())
          del catalog["catalog"]["metadata"]["last-modified"]
          Path("broken-catalog.json").write_text(json.dumps(catalog, indent=2))
          PY

      # The half of a gate that is easy to leave untested. `continue-on-error`
      # here is not a bypass: the step after it fails the job unless this step
      # failed, so the run is red both when the gate is broken and when the
      # gate cannot break.
      - name: The broken catalog must fail
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: broken-catalog.json

      - name: Fail if the gate let the broken catalog through
        if: steps.broken.outcome != 'failure'
        run: |
          echo "::error::action.yml passed a catalog missing a required property"
          exit 1

      # The annotation's line number, on the runner, against the file the
      # steps above just built. `make verify` covers this too, but a workflow
      # command is a thing GitHub reads rather than a string a test compares,
      # and the difference between annotating the file and annotating the line
      # only exists here. The expected line is derived from the document rather
      # than written down: a hard-coded number would go stale the first time
      # the fixture is edited, and would still pass while pointing at the
      # wrong line.
      - name: The annotation lands on the line the finding is about
        env:
          PYTHONPATH: src
          OSCAL_PATH: broken-catalog.json
        run: |
          python3 tools/action_runner.py > annotations.txt || true
          cat annotations.txt
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path("broken-catalog.json").read_text(encoding="utf-8")
          # The metadata object is where the removed required property belongs,
          # so that is the line REQUIRED_PROPERTY_MISSING must name.
          offset = source.index('"metadata"')
          expected = source.count("\n", 0, source.index("{", offset)) + 1

          annotations = Path("annotations.txt").read_text(encoding="utf-8")
          wanted = re.compile(
              r"^::error file=broken-catalog\.json,line=(\d+),col=(\d+),"
              r"title=REQUIRED_PROPERTY_MISSING",
              re.MULTILINE,
          )
          found = wanted.search(annotations)
          if found is None:
              sys.exit(
                  "no REQUIRED_PROPERTY_MISSING annotation carried a line and a column:\n"
                  + annotations
              )
          if int(found.group(1)) != expected:
              sys.exit(
                  f"the annotation names line {found.group(1)}; the metadata object "
                  f"opens on line {expected}"
              )
          print(f"annotated line {found.group(1)}, column {found.group(2)}")
          PY
